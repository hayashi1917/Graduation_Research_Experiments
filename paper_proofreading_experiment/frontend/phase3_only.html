<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>フェーズ3 簡易アップローダー</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/phase3_only.css">
</head>
<body>
    <main class="container py-5">
        <section class="text-center mb-4">
            <h1 class="fw-bold">フェーズ3 簡易アップローダー</h1>
            <p class="text-muted mb-0">イテレーションごとに TeX / PDF を登録してください。必要な情報だけを入力するシンプルなUIです。</p>
        </section>

        <div class="card shadow-sm">
            <div class="card-body">
                <form id="phase3-form" class="row g-3" novalidate>
                    <div class="col-md-6">
                        <label for="paper-id" class="form-label">論文ID</label>
                        <input type="text" class="form-control" id="paper-id" placeholder="example-paper" required>
                    </div>
                    <div class="col-md-6">
                        <label for="iteration" class="form-label">イテレーション番号</label>
                        <input type="number" class="form-control" id="iteration" min="1" value="1" required>
                    </div>
                    <div class="col-md-6">
                        <label for="tex-file" class="form-label">TeXファイル (.tex)</label>
                        <input type="file" class="form-control" id="tex-file" accept=".tex" required>
                    </div>
                    <div class="col-md-6">
                        <label for="pdf-file" class="form-label">PDFファイル (.pdf)</label>
                        <input type="file" class="form-control" id="pdf-file" accept="application/pdf" required>
                    </div>
                    <div class="col-12">
                        <button type="submit" class="btn btn-primary px-4">アップロード</button>
                    </div>
                </form>
            </div>
        </div>

        <div id="status-area" class="alert mt-4 d-none" role="alert"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.8/dist/axios.min.js"></script>
    <script type="module" src="/static/js/phase3_only.js"></script>
</body>
</html>
