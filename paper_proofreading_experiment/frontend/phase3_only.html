<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>論文校正システム</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/phase3_only.css">
</head>
<body>
    <main class="container py-5">
        <section class="text-center mb-4">
            <h1 class="fw-bold">論文校正システム</h1>
        </section>

        <div class="card shadow-sm">
            <div class="card-body">
                <form id="phase3-form" class="row g-3" novalidate>
                    <div class="col-md-6">
                        <label for="paper-id" class="form-label">論文ID</label>
                        <input type="text" class="form-control" id="paper-id" placeholder="example-paper" required>
                    </div>
                    <div class="col-md-6">
                        <label for="tex-file" class="form-label">TeXファイル (.tex)</label>
                        <input type="file" class="form-control" id="tex-file" accept=".tex" required>
                    </div>
                    <div class="col-md-6">
                        <label for="pdf-file" class="form-label">PDFファイル (.pdf)</label>
                        <input type="file" class="form-control" id="pdf-file" accept="application/pdf" required>
                    </div>
                    <div class="col-12">
                        <label for="excluded-items" class="form-label">除外するチェックリスト項目</label>
                        <textarea class="form-control" id="excluded-items" rows="3" placeholder=""></textarea>
                    </div>
                    <div class="col-12">
                        <button type="submit" class="btn btn-primary px-4">校正する</button>
                    </div>
                </form>
            </div>
        </div>

        <div id="status-area" class="alert mt-4 d-none" role="alert"></div>
        <div id="result-card" class="card shadow-sm mt-4 d-none">
            <div class="card-body">
                <h2 class="h5 mb-3">校正結果</h2>
                <p id="result-summary" class="mb-3 text-muted"></p>
                <div id="excluded-wrapper" class="mb-3 d-none">
                    <h3 class="h6">除外した項目</h3>
                    <ul id="excluded-list" class="list-group list-group-flush"></ul>
                </div>
                <div id="issues-wrapper" class="d-none">
                    <h3 class="h6">指摘一覧</h3>
                    <div id="issues-list" class="list-group list-group-flush"></div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.8/dist/axios.min.js"></script>
    <script type="module" src="/static/js/phase3_only.js"></script>
</body>
</html>
