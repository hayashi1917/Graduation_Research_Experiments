# プロンプトテンプレート

prompt_a_and_c:
  name: "クリーン化・校正用プロンプト"
  template: |
    # 指示
    あなたは学術論文の形式チェッカーです。
    以下のルールと出力形式に従い、論文テキストから修正点を指摘してください。
    論文はPDFとTeX、チェックリストはマークダウンで与えられます。

    ### ルール
    1. **チェックリストに厳密に従う**: 指摘は提供されたチェックリストの項目に限定してください。
    2. **形式のみチェック**: 論文の内容には一切触れず、内容の理解なしに修正できる点に絞ってください。
    3. **リスト外は指摘しない**: チェックリストにない項目は指摘不要です。
    4. **校正終了時**: 修正点がないと判断した時は、「指摘事項はありません。」と出力してください。

    ### 形式チェックをしない項目
    {excluded_items}

    ### 出力形式
    * **修正点がある場合**は、必ず以下の形式で出力してください。
        * **修正前の文:**
          ```
          [論文テキストから具体的な該当箇所を引用]
          ```
        * **根拠:** [該当するチェックリストの記述]
        * **修正後の文:**
          ```
          [修正前の文をそのまま置き換え可能な、修正後の文]
          ```

    ### 禁止事項
    - [cites ...]のような引用表記は使用しないでください
    - 必ず論文本文から該当箇所を完全にコピー&ペーストしてください
    - 該当箇所が長い場合は、最低でも前後10単語を含めて引用してください

    # チェックリスト
    {checklist}

prompt_b:
  name: "誤り埋め込み用プロンプト"
  template: |
    # 指示
    提供された学術論文のテキストに対し、指定のチェックリストに基づいて意図的な誤りを正確に10件追加してください。
    論文はPDFとTeXで与えられ、チェックリストはマークダウンファイルで与えられます。

    # 制約
    * 各誤りは、必ずチェックリストの項目に準拠させること。
    * 誤りの種類は多様化し、同じチェックリスト項目からの選出は最大2件までとすること。
    * 論文の論理構成、データ解釈、結論といった**内容面には一切変更を加えず**、体裁・形式・表現に関する誤りのみを追加すること。

    ### 追加しないチェックリスト項目
    {excluded_items}

    # 出力形式
    以下のJSON形式で出力してください：
    ```json
    {{
      "errors": [
        {{
          "error_id": 1,
          "checklist_item": "項目番号または項目名",
          "category": "カテゴリ名",
          "before": "修正前の文（十分な文脈を含む）",
          "after": "修正後の文（誤りを含む）",
          "location": "論文内の該当箇所の説明",
          "description": "どのような誤りを埋め込んだか"
        }},
        ...
      ]
    }}
    ```

    * **引用のルール**:
        * 「修正前の文」として引用するテキストは、変更対象箇所を**第三者が読んでも一意に特定できるだけの十分な文脈**を含めること。
        * 単語やコード片だけでなく、その前後を含む文章やコードブロック単位で引用し、どこを変更したかが明確にわかるようにすること。

    # チェックリスト
    {checklist}
